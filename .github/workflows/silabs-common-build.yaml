name: Common Build

on:
    workflow_call:
        inputs:
            example-app:
                required: true
                type: string
            output-directory:
                required: true
                type: string
            build-type:
                required: true
                type: string

jobs:
    build:
        runs-on: ubuntu-latest

        container:
            image: ghcr.io/project-chip/chip-build-efr32:115

        strategy:
            fail-fast: false
            matrix:
                platform: [mg24, mgm24, mg26, siwx]
                protocol: [thread, 917-soc, rs911x, wf200]

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                submodules: 'true'

            - name: Install tools
              uses: ./.github/actions/install-tools

            - name: Copy matter_extension to simplicity_sdk and set Matter Extension Environment Variable
              run: |
                cd third_party/simplicity_sdk
                git lfs install
                git lfs pull
                echo "MATTER_EXTN_ROOT=${SISDK_ROOT}extension/matter_extension" >> $GITHUB_ENV
                echo "STUDIO_ADAPTER_PACK_PATH=/opt/silabs/zap-linux-x64" >> $GITHUB_ENV
                
            - name: Build ${{ inputs.example-app }} configurations
              uses: SiliconLabsSoftware/matter_build_action@3fa7357e526337fb8f370a20158b8857aeb708ab
              with:
                  json-file-path: >                   
                      ${{ matrix.platform == 'mg24' && './.github/silabs-builds-mg24.json' ||
                          matrix.platform == 'mgm24' && './.github/silabs-builds-mgm24.json' ||
                          matrix.platform == 'mg26' && './.github/silabs-builds-mg26.json' ||
                          matrix.platform == 'siwx' && './.github/silabs-builds-siwx.json' }}
                  path-to-example-app: slc/sample-app/${{ inputs.example-app }}/efr32/${{ inputs.example-app }}-${{ matrix.protocol}}.slcp
                  example-app: ${{ inputs.example-app }}
                  build-script: "./slc/build.sh"
                  #output-directory: ${{ inputs.output-directory }}
                  output-directory: " "
                  build-type: ${{ inputs.build-type }}